name = "limonach-game-event-worker"
main = "worker.js"
compatibility_date = "2024-09-23"

# supabase-js's core client is fetch-based and generally edge-compatible
# without this flag, but it's kept as cheap insurance against dynamic
# Node.js imports surfacing through transitive dependencies.
compatibility_flags = ["nodejs_compat"]

# ---------------------------------------------------------------------
# KV namespace used for rate limiting — REPLACE id after running:
#   wrangler kv namespace create RATE_LIMIT
# ---------------------------------------------------------------------
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "90b4297ff1a64a919c35b3e0b60cbe5f"

# ---------------------------------------------------------------------
# Durable Objects — real-time state for Think Rush matches. One
# MatchmakingQueue instance total (singleton "global"), one
# ThinkRushMatch instance per active match.
# ---------------------------------------------------------------------
[[durable_objects.bindings]]
name = "MATCHMAKING_QUEUE"
class_name = "MatchmakingQueue"

[[durable_objects.bindings]]
name = "THINK_RUSH_MATCH"
class_name = "ThinkRushMatch"

[[migrations]]
tag = "v1-think-rush"
new_sqlite_classes = ["MatchmakingQueue", "ThinkRushMatch"]

# ---------------------------------------------------------------------
# Cron trigger: cleans up expired sessions once a day at 03:00 UTC.
# This keeps cleanup OFF the request path entirely.
# ---------------------------------------------------------------------
[triggers]
crons = ["0 3 * * *"]

# ---------------------------------------------------------------------
# Public, non-secret configuration.
# SUPABASE_URL is not sensitive on its own (it's the project's public
# REST endpoint) but keep it out of any public frontend bundle anyway —
# only this Worker should ever talk to Supabase directly.
#
# Secrets (GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, GOOGLE_REDIRECT_URI,
# SESSION_SECRET, SUPABASE_SERVICE_ROLE_KEY, TURNSTILE_SECRET_KEY) must be
# set with `wrangler secret put`, NEVER here.
#
# TURNSTILE_SITE_KEY below is NOT secret — it's meant to be public and is
# also what your frontend embeds directly to render the widget.
# ---------------------------------------------------------------------
[vars]
ALLOWED_ORIGIN = "https://limonach-game-event.pages.dev"
SUPABASE_URL = "https://pktulmzlxgrqqmlgwzfh.supabase.co"
TURNSTILE_SITE_KEY = "0x4AAAAAAEhdS8Wfdp0Mpshs"
SESSION_DURATION_SECONDS = "2592000"
