# ROBOT BATTLE ROYALE - Stage 3 - wrangler.toml (repo root, next to worker.js; used by Workers Builds / Git deploy)
# Secrets (NOT here): JOIN_SECRET, ADMIN_KEY, SUPABASE_SERVICE_ROLE_KEY, TELEGRAM_BOT_TOKEN
name = "limonach-game-event-worker"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
ALLOWED_ORIGIN = "https://limonach-game-event.pages.dev"
SUPABASE_URL = "https://pktulmzlxgrqqmlgwzfh.supabase.co"
XROCKET_BASE = "https://pay.api.testnet.xrocket.exchange"   # TESTNET while testing. For REAL money use https://pay.api.xrocket.exchange (and then replace the two xRocket secrets with the production ones)
ALLOW_GUEST = "0"   # production: only Telegram accounts. Set "1" only for temporary browser tests.

[[durable_objects.bindings]]
name = "MATCH"
class_name = "MatchRoom"

[[durable_objects.bindings]]
name = "MM"
class_name = "Matchmaker"

[[durable_objects.bindings]]
name = "RLIM"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Matchmaker"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["RateLimiter"]

[[kv_namespaces]]
binding = "RL"
id = "90b4297ff1a64a919c35b3e0b60cbe5f"

[triggers]
crons = ["*/10 * * * *", "0 6 * * *"]   # retries any end-of-match write that failed

# LOAD TESTS ONLY: add this line under [vars] (and delete it again afterwards):
# LOADTEST = "1"

# Financial ledger (Cloudflare D1). Create the database in Dashboard -> Storage & Databases -> D1, run d1.sql in its Console, then paste its ID below.
[[d1_databases]]
binding = "DB"
database_name = "robot-br-fin"
database_id = "1df3d35b-fc94-4804-993b-c71c44c8178c"

# New secrets (Worker -> Settings -> Variables and Secrets): XROCKET_TOKEN (API Token) and XROCKET_WEBHOOK_SECRET (Webhook Token). Webhook URL in @xRocket: https://limonach-game-event-worker.ayoubvib130.workers.dev/xrocket/webhook
